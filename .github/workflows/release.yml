# A tag like v1.3 builds, tests and publishes a release with one download
# per system (R23). The download buttons in README.md and on the website
# always point to the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package
        run: bash tools/package.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sh dist/SHA256SUMS.txt \
            --title "The Daemon's Apprentice $GITHUB_REF_NAME" --notes-file dist/NOTES.md --verify-tag
