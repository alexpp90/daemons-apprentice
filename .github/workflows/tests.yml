# Every push and pull request: all the variants that matter, as parallel
# jobs, so the whole run takes a few minutes (R24). tests/README.md lists
# every variant and why it runs here, weekly, or not at all.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Syntax, Bash 3.2 constructs, shellcheck, design rules, guard, text widths
        run: bash tests/run_all.sh static

  play:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux - every level from a fresh home, every scenario
            os: ubuntu-latest
            run: bash tests/autoplay.sh @standard
          # With TQ_TLSLAB_PERL=1 Level 19's HTTPS lab runs the perl server
          # the Mac uses (its LibreSSL s_server cannot bind 127.0.0.1 only).
          # Ubuntu's perl needs IO::Socket::SSL for it; the Mac's has it.
          - name: Linux - the whole game in one home
            os: ubuntu-latest
            run: >-
              sudo apt-get update -qq && sudo apt-get install -y -qq libio-socket-ssl-perl &&
              perl -MIO::Socket::SSL -e 1 &&
              TQ_TLSLAB_PERL=1 bash tests/autoplay.sh full
          - name: Linux - second driver (Python pty)
            os: ubuntu-latest
            run: python3 tests/autoplay.py @standard
          - name: macOS Apple silicon - Bash 3.2, every level, every scenario
            os: macos-latest
            run: /bin/bash tests/run_all.sh standard
          # The Mac's whole game in one home (about 8 minutes, one game after
          # the other) runs weekly in compat.yml; here every level is played
          # from a fresh home, in parallel, which covers the same tasks.
          - name: macOS Apple silicon - no developer tools, every level
            os: macos-latest
            run: TQ_NOCLT=1 /bin/bash tests/autoplay.sh @standard
          - name: macOS Intel - every level, every scenario
            os: macos-15-intel
            run: /bin/bash tests/autoplay.sh @standard
    steps:
      - uses: actions/checkout@v5
      - name: Play
        env:
          # On a Mac: the system's own Bash 3.2, never Homebrew's.
          TQ_BASH: ${{ startsWith(matrix.os, 'macos') && '/bin/bash' || 'bash' }}
        run: ${{ matrix.run }}
      - name: Keep the transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ strategy.job-index }}
          path: tests/out/
          retention-days: 7
